name: longinvest

x-backend-image: &backend-image
  image: ${LONGINVEST_BACKEND_IMAGE:-longinvest-backend:local}
  build:
    context: ..
    dockerfile: deploy/docker/backend.Dockerfile
    target: runtime

services:
  strategy-runner-image:
    profiles: ["strategy-runner-build"]
    image: ${LONGINVEST_STRATEGY_RUNNER_IMAGE:-longinvest-strategy-runner:local}
    build:
      context: ..
      dockerfile: deploy/docker/strategy-runner.Dockerfile
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    mem_limit: 512m
    pids_limit: 32
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/strategy-runner-seccomp.json

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${LONGINVEST_POSTGRES_DB:-longinvest}
      POSTGRES_USER: ${LONGINVEST_POSTGRES_USER:-longinvest}
      POSTGRES_PASSWORD: ${LONGINVEST_POSTGRES_PASSWORD:-longinvest-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true


  migrate:
    <<: *backend-image
    command: ["python", "-m", "long_invest.entrypoints.migrate"]
    environment:
      LONGINVEST_ENVIRONMENT: development
      LONGINVEST_DATABASE_URL: postgresql+asyncpg://longinvest_app:${LONGINVEST_DATABASE_APP_PASSWORD:-longinvest-app-local-only}@postgres:5432/${LONGINVEST_POSTGRES_DB:-longinvest}
      LONGINVEST_DATABASE_OWNER_URL: postgresql+asyncpg://${LONGINVEST_POSTGRES_USER:-longinvest}:${LONGINVEST_POSTGRES_PASSWORD:-longinvest-local-only}@postgres:5432/${LONGINVEST_POSTGRES_DB:-longinvest}
      LONGINVEST_DATABASE_APP_ROLE: longinvest_app
      LONGINVEST_DATABASE_APP_PASSWORD: ${LONGINVEST_DATABASE_APP_PASSWORD:-longinvest-app-local-only}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

  api:
    <<: *backend-image
    environment:
      LONGINVEST_ENVIRONMENT: development
      LONGINVEST_DATABASE_URL: postgresql+asyncpg://longinvest_app:${LONGINVEST_DATABASE_APP_PASSWORD:-longinvest-app-local-only}@postgres:5432/${LONGINVEST_POSTGRES_DB:-longinvest}
      LONGINVEST_LOG_FILE: /var/log/longinvest/application.jsonl
      LONGINVEST_STRATEGY_RUNNER_IMAGE_DIGEST: ${LONGINVEST_STRATEGY_RUNNER_IMAGE_DIGEST:-}
      LONGINVEST_BACKTEST_CONCURRENCY: ${LONGINVEST_BACKTEST_CONCURRENCY:-4}
      LONGINVEST_MASTER_KEY: ${LONGINVEST_MASTER_KEY:-}
      LONGINVEST_NOTIFICATION_ALLOWED_SMTP_HOSTS: ${LONGINVEST_NOTIFICATION_ALLOWED_SMTP_HOSTS:-}
      LONGINVEST_AUTH_ALLOWED_ORIGINS: ${LONGINVEST_AUTH_ALLOWED_ORIGINS:-http://127.0.0.1:15173,http://localhost:15173}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:18080:8000
    volumes:
      - application_logs:/var/log/longinvest
      - strategy_git_data:/var/lib/long-invest/strategies
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "7"

  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
      target: runtime
    depends_on:
      api:
        condition: service_healthy
    ports:
      - ${LONGINVEST_FRONTEND_BIND:-15173:8080}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  background-core:
    <<: *backend-image
    command:
      - python
      - -m
      - long_invest.entrypoints.background
    environment:
      LONGINVEST_ENVIRONMENT: development
      LONGINVEST_DATABASE_URL: postgresql+asyncpg://longinvest_app:${LONGINVEST_DATABASE_APP_PASSWORD:-longinvest-app-local-only}@postgres:5432/${LONGINVEST_POSTGRES_DB:-longinvest}
      LONGINVEST_LOG_FILE: /var/log/longinvest/background-core-supervisor.jsonl
      LONGINVEST_MASTER_KEY: ${LONGINVEST_MASTER_KEY:-}
      LONGINVEST_NOTIFICATION_ALLOWED_SMTP_HOSTS: ${LONGINVEST_NOTIFICATION_ALLOWED_SMTP_HOSTS:-}
      LONGINVEST_STRATEGY_RUNNER_IMAGE_DIGEST: ${LONGINVEST_STRATEGY_RUNNER_IMAGE_DIGEST:-}
      LONGINVEST_BACKTEST_CONCURRENCY: ${LONGINVEST_BACKTEST_CONCURRENCY:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - application_logs:/var/log/longinvest
      - strategy_git_data:/var/lib/long-invest/strategies
      - /var/run/docker.sock:/var/run/docker.sock
      - ./security/strategy-runner-seccomp.json:/etc/long-invest/seccomp.json:ro
    group_add:
      - ${LONGINVEST_DOCKER_GID:-999}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import pathlib,time,sys;
          p=pathlib.Path('/tmp/longinvest-background-heartbeat');
          sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime <= 30 else 1)
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,nosuid,nodev
    mem_limit: 1536m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "7"


  test:
    profiles: ["test"]
    image: ${LONGINVEST_BACKEND_TEST_IMAGE:-longinvest-backend-test:local}
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
      target: test
    environment:
      LONGINVEST_ENVIRONMENT: test
      LONGINVEST_DATABASE_URL: postgresql+asyncpg://longinvest_app:${LONGINVEST_DATABASE_APP_PASSWORD:-longinvest-app-local-only}@postgres:5432/${LONGINVEST_POSTGRES_DB:-longinvest}
      LONGINVEST_DATABASE_OWNER_URL: postgresql+asyncpg://${LONGINVEST_POSTGRES_USER:-longinvest}:${LONGINVEST_POSTGRES_PASSWORD:-longinvest-local-only}@postgres:5432/${LONGINVEST_POSTGRES_DB:-longinvest}
      LONGINVEST_DATABASE_APP_ROLE: longinvest_app
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    read_only: true
    volumes:
      - strategy_test_git_data:/var/lib/long-invest/strategies
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  application_logs:
  strategy_git_data:
  strategy_test_git_data:
